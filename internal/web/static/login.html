<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome · Recall</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="login-page">
    <main class="login-form-wrap">
      <a class="brand" href="/login.html"
        ><span class="brand-icon">r.</span>Recall</a
      >
      <section class="login-card">
        <span class="eyebrow">YOUR STUDY SPACE</span>
        <h1 id="form-title">Welcome back.</h1>
        <p class="subtitle">Pick up where your curiosity left off.</p>
        <p id="login-message" class="message" role="status" hidden></p>
        <form id="login-form">
          <label for="email">Email address</label
          ><input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          /><label for="password">Password</label
          ><input
            id="password"
            type="password"
            autocomplete="current-password"
            minlength="8"
            placeholder="At least 8 characters"
            required
          /><button id="submit" type="submit">Sign in →</button>
        </form>
        <p class="login-switch">
          <span id="switch-prompt">New here?</span>
          <button id="switch" class="link" type="button">
            Create an account
          </button>
        </p>
        <div class="demo-divider"><span>JUST LOOKING AROUND?</span></div>
        <button id="demo-login" class="secondary">Explore the demo ↗</button>
        <p class="meta demo-note">
          Try a ready-made study session. No sign-up needed.
        </p>
      </section>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
