<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Notes · Recall</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/library.html"
        ><span class="brand-icon" aria-hidden="true">r.</span>Recall</a
      >
      <nav aria-label="Main navigation">
        <a href="/library.html" aria-current="page">Notes</a>
        <a href="/">Review</a>
        <a href="/ask.html">Ask</a>
      </nav>
      <span id="account" class="account"></span>
    </header>
    <main>
      <div class="page-heading">
        <div>
          <a id="back-to-notes" class="text-link" href="/library.html" hidden
            >← All notes</a
          >
          <h1 id="library-title">Notes</h1>
          <p id="library-subtitle" class="subtitle">
            Upload a PDF, text or Markdown file. Recall writes questions from it,
            usually within a minute.
          </p>
        </div>
        <div class="section-actions">
          <a id="review-folder" class="button secondary" hidden
            >Review this folder</a
          ><button id="new-folder" class="secondary" type="button">
            New folder</button
          ><form id="upload">
            <label class="button file-label" for="file"
              >Upload notes<input
                id="file"
                type="file"
                accept=".pdf,.txt,.md,.markdown"
                required
            /></label>
          </form>
        </div>
      </div>
      <p id="upload-message" class="message" role="status" hidden></p>
      <p id="list-message" class="message" role="status" hidden></p>
      <h2 id="folders-title" hidden>Folders</h2>
      <div id="folders" class="document-grid"></div>
      <div id="documents" class="document-grid" aria-live="polite">
        <div class="empty-state">Loading your notes…</div>
      </div>
    </main>
    <dialog id="folder-dialog">
      <form id="folder-form">
        <div class="section-heading">
          <h2 id="folder-dialog-title">New folder</h2>
          <button
            type="button"
            class="icon-button"
            id="close-folder"
            aria-label="Close"
          >
            ×
          </button>
        </div>
        <label for="folder-name">Folder name</label
        ><input
          id="folder-name"
          maxlength="80"
          required
          placeholder="e.g. Distributed systems"
        />
        <p id="folder-message" class="message" role="status" hidden></p>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancel-folder">
            Cancel</button
          ><button type="submit">Save folder</button>
        </div>
      </form>
    </dialog>
    <dialog id="move-dialog">
      <form id="move-form">
        <div class="section-heading">
          <h2 id="move-dialog-title">Move note</h2>
          <button
            type="button"
            class="icon-button"
            id="close-move"
            aria-label="Close"
          >
            ×
          </button>
        </div>
        <label for="move-folder">Move to</label>
        <select id="move-folder"></select>
        <p id="move-message" class="message" role="status" hidden></p>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancel-move">
            Cancel</button
          ><button type="submit">Move note</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/library.js"></script>
  </body>
</html>
