<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Document · Recall</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/library.html"
        ><span class="brand-icon" aria-hidden="true">r.</span>Recall<span
          class="brand-caption"
          >YOUR STUDY SPACE</span
        ></a
      >
      <nav aria-label="Main navigation">
        <a href="/library.html" aria-current="page">Library</a
        ><a href="/" data-nav="review">Review</a
        ><a href="/ask.html" data-nav="ask">Ask your notes</a>
      </nav>
      <span id="account" class="account"></span>
    </header>
    <main class="viewer-layout">
      <div class="page-heading">
        <div>
          <p class="eyebrow">YOUR ORIGINAL DOCUMENT</p>
          <h1 id="viewer-title">Opening document…</h1>
        </div>
        <a class="text-link" href="/library.html">Back to library ↗</a>
      </div>
      <p id="viewer-message" class="message" role="status" hidden></p>
      <div id="viewer-actions" class="viewer-actions" hidden>
        <a id="open-pdf" class="button secondary" target="_blank" rel="noopener"
          >Open PDF in a new tab ↗</a
        ><a id="document-review" class="button">Practise this document →</a
        ><span class="meta"
          >Read the original pages, just as you uploaded them.</span
        >
      </div>
      <section id="pdf-reader" hidden aria-label="PDF reader">
        <div class="pdf-toolbar">
          <button
            id="previous-page"
            class="secondary"
            aria-label="Previous page"
          >
            ←
          </button>
          <label for="page-number">Page</label
          ><input
            id="page-number"
            type="number"
            min="1"
            value="1"
            aria-label="Page number"
          /><span id="page-total"></span>
          <button id="next-page" class="secondary" aria-label="Next page">
            →
          </button>
          <label for="pdf-zoom">Zoom</label
          ><select id="pdf-zoom">
            <option value="1">Fit width</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
          </select>
        </div>
        <div id="pdf-stage">
          <canvas id="pdf-canvas" aria-label="Original PDF page"></canvas>
        </div>
        <details class="pdf-accessible">
          <summary>Page text</summary>
          <div id="pdf-page-text" class="text"></div>
        </details>
      </section>
      <div id="text-document" class="panel text" hidden></div>
    </main>
    <script type="module" src="/viewer.js"></script>
  </body>
</html>
