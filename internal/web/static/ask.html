<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ask · Recall</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/"
        ><span class="brand-icon" aria-hidden="true">r.</span>Recall</a
      >
      <nav aria-label="Main navigation">
        <a href="/">Review</a>
        <a href="/library.html">Notes</a>
        <a href="/ask.html" aria-current="page">Ask</a>
      </nav>
      <span id="account" class="account"></span>
    </header>
    <main>
      <div class="page-heading">
        <div>
          <h1>Ask</h1>
          <p class="subtitle">
            Ask a question and Recall answers from your notes, showing where
            each part came from.
          </p>
        </div>
      </div>
      <div class="panel">
        <form id="ask">
          <textarea
            id="question"
            placeholder="What do you want to know?"
            required
          ></textarea>
          <p><button type="submit">Ask</button></p>
        </form>
      </div>
      <p id="ask-message" class="message" hidden></p>
      <section id="result" hidden></section>
      <section id="context" class="context panel" hidden></section>
    </main>
    <script type="module" src="/ask.js"></script>
  </body>
</html>
