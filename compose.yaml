services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: recall
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
    ports:
      - "5434:5432"
    volumes:
      - recall_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall -d recall"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - recall_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    ports:
      - "8090:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://recall:recall@postgres:5432/recall?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    ports:
      - "8091:8081"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://recall:recall@postgres:5432/recall?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  recall_postgres_data:
  recall_redis_data:
